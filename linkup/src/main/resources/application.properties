spring.application.name=linkedin-writer

groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.api.key=${GROQ_API_KEY:}
server.port=${SERVER_PORT:8086}

# Datasource (MySQL in production). Uses environment variables: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/linkup_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1291}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQL8Dialect}

logging.level.com.linkup.ai=INFO
logging.level.org.springframework.web=WARN

# JWT configuration
jwt.secret=${JWT_SECRET:changeit_jwt_secret_please_change}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}